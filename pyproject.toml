[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hcam-core"
version = "0.1.0"
description = "H-CAM camera registry backend foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.5,<2.0",
  "fastapi>=0.139.0,<1.0",
  "pydantic>=2.12.0,<3.0",
  "sqlalchemy>=2.0.51,<3.0",
  "uvicorn>=0.35.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9.0,<3.0",
  "pytest>=8.4.0,<10.0",
]

[project.scripts]
hcam = "hcam.cli:main"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [".", "app"]
testpaths = ["tests"]
