[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hcam-core"
dynamic = ["version"]
description = "H-CAM camera registry backend foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.5,<2.0",
  "fastapi>=0.139.0,<1.0",
  "pydantic>=2.12.0,<3.0",
  "prometheus-client>=0.26.0,<1.0",
  "sqlalchemy>=2.0.51,<3.0",
  "uvicorn>=0.35.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.5.0,<2.0",
  "httpx2>=2.9.0,<3.0",
  "pip-audit>=2.10.1,<3.0",
  "pytest>=8.4.0,<10.0",
  "pytest-cov>=7.1.0,<8.0",
  "ruff>=0.16.0,<0.17",
]
postgres = [
  "psycopg[binary]>=3.3.0,<4.0",
]

[project.scripts]
hcam = "hcam.cli:main"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.dynamic]
version = {attr = "hcam.__version__"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [".", "app"]
testpaths = ["tests"]
markers = [
  "postgres: integration tests that require HCAM_POSTGRES_TEST_URL",
]

[tool.coverage.run]
branch = true
source = ["hcam"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
