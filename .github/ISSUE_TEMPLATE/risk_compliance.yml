name: Risk or compliance item
description: Track a security, privacy, operational, or governance risk.
title: "[Risk]: "
labels: [security]
body:
  - type: dropdown
    id: risk-class
    attributes:
      label: Risk Class
      options: [Security, Privacy, Safety, Availability, Compliance, Supply Chain, Operations]
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Critical, High, Medium, Low]
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data Involved
      description: Identify categories only. Never paste credentials, private URLs, camera frames, or sensitive records.
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Risk Scenario
      description: Explain threat, affected assets, likelihood, and impact.
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Required Controls
      description: List preventive, detective, recovery, authorization, retention, and audit controls.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation Evidence
      description: Link sanitized tests, reviews, scans, and operational proof.
    validations:
      required: true
