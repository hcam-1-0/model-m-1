name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel-probe:
    name: Sentinel probe offline checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Phase 0 tools
        run: python -m py_compile tools/sentinel_cctv_probe.py tools/phase0_readiness.py

      - name: Run offline tests
        run: python -m unittest discover -s tests -v
