name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Backend and offline checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q app tools migrations

      - name: Preserve Phase 0 compile check
        run: python -m py_compile tools/sentinel_cctv_probe.py tools/phase0_readiness.py

      - name: Verify database migration
        env:
          HCAM_DATABASE_URL: sqlite:///./var/ci-hcam.db
        run: alembic upgrade head

      - name: Run backend and offline tests
        run: pytest

      - name: Verify Phase 1 evidence
        run: python tools/phase1_readiness.py

      - name: Preserve Phase 0 unittest check
        run: python -m unittest discover -s tests -v
